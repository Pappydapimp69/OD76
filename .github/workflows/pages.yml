name: Deploy OD76 to Pages
run-name: OD76 B123 Reach ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Assemble direct site
        run: |
          rm -rf _site
          mkdir _site
          cp index.html _site/
          cat $(ls b21-*.js | sort -V) > _site/game.js
          sed -i 's/OD76-2026-08-12-B21-STARDRIVE/OD76-2026-10-01-B123-REACH/g' _site/index.html
          sed -i 's/game.js?v=B21-STARDRIVE/game.js?v=B123-REACH/g' _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
